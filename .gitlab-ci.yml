# GitLab Pages 部署配置
# 纯静态站点：把 index.html 与 assets 复制到 public，交给 Pages 发布
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - rm -rf public
    - mkdir -p public
    - cp index.html public/
    - cp -r assets public/
    - echo "deployed $(date -u +%FT%TZ)" > public/build-info.txt
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
